services:
  - type: web
    name: gamesweekend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: GOOGLE_SHEETS_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GMAIL_SMTP_USERNAME
        sync: false
      - key: GMAIL_SMTP_APP_PASSWORD
        sync: false
      - key: GMAIL_FROM_EMAIL
        sync: false
      - key: GMAIL_SMTP_HOST
        value: smtp.gmail.com
      - key: GMAIL_SMTP_PORT
        value: "587"
      - key: ADMIN_PASSWORD
        sync: false
      - key: FLASK_SECRET_KEY
        sync: false
      - key: LOG_LEVEL
        value: INFO
