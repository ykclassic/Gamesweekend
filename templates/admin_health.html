<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>System Health — Games Weekend</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:20px}main{width:min(760px,100%);margin:auto}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:20px}h1{margin:0}.muted{color:#667085}.button{display:inline-block;padding:10px 14px;border-radius:10px;background:#e9edf5;color:#172033;text-decoration:none;font-weight:700}.summary{padding:14px 16px;border-radius:12px;margin-bottom:16px;background:#e8f5e9;color:#176b36}.summary.bad{background:#fff1ef;color:#8b1e17}.check{background:#fff;border:1px solid #e6eaf0;border-radius:14px;padding:16px;margin-bottom:10px;display:flex;justify-content:space-between;gap:16px}.ok{color:#176b36;font-weight:800}.bad{color:#b42318;font-weight:800}@media(max-width:600px){body{padding:14px}.top{align-items:flex-start;flex-direction:column}.check{display:block}.check strong{display:block;margin-bottom:5px}}</style></head><body><main><header class="top"><div><h1>System Health</h1><div class="muted">Administrator-only dependency checks</div></div><a class="button" href="{{ url_for('admin_dashboard') }}">← Dashboard</a></header><div class="summary {{ '' if overall else 'bad' }}">{{ 'All monitored services are healthy.' if overall else 'One or more monitored services require attention.' }}</div>{% for check in checks %}<section class="check"><div><strong>{{ check.name }}</strong><div class="muted">{{ check.detail }}</div></div><div class="{{ 'ok' if check.ok else 'bad' }}">{{ 'OK' if check.ok else 'FAILED' }}</div></section>{% endfor %}</main></body></html>
