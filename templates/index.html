<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekend Games - Check In</title>
    <!-- Tailwind CSS for clean, modern styling matching your screenshot -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen px-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-sm border border-gray-100 p-8 space-y-6">
        
        <!-- Flask Flash Messages / Error Banner -->
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="space-y-2">
                    {% for message in messages %}
                        <div class="p-4 bg-red-50 border border-red-100 text-red-700 rounded-xl text-sm font-medium text-center">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <!-- Header Section -->
        <div class="text-center space-y-2">
            <h1 class="text-3xl font-bold tracking-tight text-gray-900">Welcome!</h1>
            <p class="text-gray-500 text-sm">Check in to discover your team for the weekend.</p>
        </div>

        <!-- Check-In Form -->
        <form action="/" method="POST" class="space-y-4">
            <div>
                <label for="full_name" class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                <input type="text" id="full_name" name="full_name" required
                    class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent text-gray-900 text-sm"
                    placeholder="Enter your full name">
            </div>

            <div>
                <label for="email_address" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                <input type="email" id="email_address" name="email_address" required
                    class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent text-gray-900 text-sm"
                    placeholder="Enter your email address">
            </div>

            <button type="submit"
                class="w-full py-3.5 px-4 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-xl transition duration-200 shadow-sm text-sm">
                Check In & Find My Team
            </button>
        </form>

        <!-- Footer Link -->
        <div class="text-center pt-2">
            <a href="/teams" class="text-sm font-medium text-blue-600 hover:text-blue-800 transition duration-150">
                View Live Team Counts
            </a>
        </div>

    </div>

</body>
</html>
