<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Games Weekend team check-in">
  <title>Games Weekend — Check In</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #f5f7fb; color: #172033; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 480px); background: #fff; border: 1px solid #e6eaf0; border-radius: 20px; padding: 32px; box-shadow: 0 12px 40px rgba(23,32,51,.07); }
    h1 { margin: 0 0 8px; font-size: clamp(1.8rem, 7vw, 2.3rem); }
    .intro { color: #667085; margin: 0 0 28px; line-height: 1.5; }
    label { display: block; font-weight: 650; margin: 18px 0 8px; }
    input { width: 100%; border: 1px solid #d7dce5; border-radius: 12px; padding: 14px 15px; font: inherit; }
    input:focus { outline: 3px solid #dbe8ff; border-color: #4f7cff; }
    button { width: 100%; margin-top: 24px; border: 0; border-radius: 12px; padding: 15px; background: #315efb; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    button:hover { background: #244bd1; }
    .note { margin-top: 22px; color: #667085; font-size: .86rem; text-align: center; }
    .admin-link { display: block; margin-top: 18px; text-align: center; color: #315efb; font-size: .9rem; font-weight: 650; text-decoration: none; }
    .admin-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <h1>Games Weekend</h1>
    <p class="intro">Check in below and we'll assign you to a team using the current team counts.</p>
    <form method="post" novalidate>
      <label for="full_name">Full Name</label>
      <input id="full_name" name="full_name" type="text" autocomplete="name" maxlength="150" required placeholder="Your full name">
      <label for="email_address">Email</label>
      <input id="email_address" name="email_address" type="email" autocomplete="email" maxlength="254" required placeholder="you@example.com">
      <button type="submit">Check In &amp; Find My Team</button>
    </form>
    <p class="note">Your name, email, timestamp and team assignment are stored in the event registration sheet.</p>
    <a class="admin-link" href="{{ url_for('admin_login') }}">Sign in as admin</a>
  </main>
</body>
</html>
