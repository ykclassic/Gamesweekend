<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Games Weekend — Admin</title>
  <style>
    :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #f5f7fb; color: #172033; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 420px); background: #fff; border: 1px solid #e6eaf0; border-radius: 20px; padding: 32px; box-shadow: 0 12px 40px rgba(23,32,51,.07); }
    h1 { margin: 0 0 8px; }
    p { color: #667085; line-height: 1.5; }
    label { display: block; font-weight: 650; margin: 22px 0 8px; }
    input { width: 100%; padding: 14px; border: 1px solid #d7dce5; border-radius: 12px; font: inherit; }
    button { width: 100%; margin-top: 22px; padding: 14px; border: 0; border-radius: 12px; background: #315efb; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    .error { color: #b42318; background: #fef3f2; border-radius: 10px; padding: 10px 12px; }
  </style>
</head>
<body>
  <main>
    <h1>Admin access</h1>
    <p>Sign in to view live team counts. Participants cannot access this dashboard.</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post">
      <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
      <label for="password">Admin password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
