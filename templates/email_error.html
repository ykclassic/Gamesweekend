<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Check-In Saved</title>
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:#f5f7fb; color:#172033; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(100%,500px); background:#fff; border:1px solid #e6eaf0; border-radius:20px; padding:32px; text-align:center; box-shadow:0 12px 40px rgba(23,32,51,.07); }
    .team { margin:20px 0; font-size:2rem; font-weight:800; } p { color:#667085; line-height:1.5; } a { color:#315efb; font-weight:700; text-decoration:none; }
  </style>
</head>
<body><main><h1>Check-in saved</h1><p>{{ full_name }}, your assigned team is:</p><div class="team">{{ team }}</div><p>Your registration was saved, but we could not send the confirmation email. Please contact the organizers if you need the email resent.</p><a href="{{ url_for('teams') }}">View team counts</a></main></body>
</html>
