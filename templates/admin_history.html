<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin Activity — Games Weekend</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:20px}main{width:min(1000px,100%);margin:auto}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:20px}h1{margin:0}.muted{color:#667085}.button{display:inline-block;padding:10px 14px;border-radius:10px;background:#e9edf5;color:#172033;text-decoration:none;font-weight:700}.panel{background:#fff;border:1px solid #e6eaf0;border-radius:16px;padding:18px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #edf0f4;vertical-align:top}th{font-size:.8rem;color:#667085;text-transform:uppercase}@media(max-width:600px){body{padding:14px}.top{align-items:flex-start;flex-direction:column}table{display:block;overflow-x:auto;white-space:nowrap}}</style></head><body><main><header class="top"><div><h1>Admin Activity</h1><div class="muted">Latest 100 administrative actions</div></div><a class="button" href="{{ url_for('admin_dashboard') }}">← Dashboard</a></header><section class="panel">{% if entries %}<div style="overflow-x:auto"><table><thead><tr><th>Timestamp</th><th>Action</th><th>Details</th></tr></thead><tbody>{% for entry in entries %}<tr><td>{{ entry.timestamp }}</td><td>{{ entry.action }}</td><td>{{ entry.details }}</td></tr>{% endfor %}</tbody></table></div>{% else %}<p class="muted">No administrative activity has been recorded yet.</p>{% endif %}</section></main></body></html>
