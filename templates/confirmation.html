<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Games Weekend check-in confirmation">
  <meta name="robots" content="noindex,nofollow">
  <title>Check-In Confirmed — Games Weekend</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; background: #f5f7fb; color: #172033; }
    main { width: min(100%, 500px); text-align: center; background: #fff; border: 1px solid #e6eaf0; border-radius: 20px; padding: 30px 24px; box-shadow: 0 12px 40px rgba(23,32,51,.07); }
    .check { font-size: 2.5rem; }
    h1 { margin: 10px 0 8px; font-size: clamp(1.7rem, 7vw, 2.2rem); }
    p { color: #667085; line-height: 1.5; }
    .pass { margin: 24px 0; padding: 26px 20px; border: 2px solid #315efb; border-radius: 18px; background: #f7f9ff; }
    .label { margin: 0 0 8px; color: #667085; font-size: .85rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .team { font-size: clamp(2.1rem, 12vw, 3.2rem); font-weight: 850; color: #315efb; letter-spacing: .02em; }
    .actions { display: grid; gap: 10px; margin-top: 18px; }
    button { border: 0; border-radius: 12px; padding: 14px 16px; background: #315efb; color: #fff; font: inherit; font-weight: 750; cursor: pointer; }
    a { color: #315efb; text-decoration: none; font-weight: 650; padding: 8px; }
    @media print { body { background: #fff; padding: 0; } main { border: 0; box-shadow: none; } .actions, .hint { display: none; } }
  </style>
</head>
<body><main>
  <div class="check" aria-hidden="true">✓</div>
  <h1>You're checked in, {{ full_name }}!</h1>
  <p>Keep this page open so you can quickly show your team at the event.</p>
  <section class="pass" aria-label="Your team pass">
    <p class="label">Your Games Weekend Team</p>
    <div class="team">{{ team }}</div>
  </section>
  <div class="actions">
    <button type="button" onclick="window.print()">Print / Save this pass</button>
    <a href="{{ url_for('index') }}">Back to check-in</a>
  </div>
  <p class="hint">Your registration has been saved. If you need help with your team, please speak with an organizer.</p>
</main></body>
</html>
