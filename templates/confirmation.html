<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Check-In Confirmed</title>
  <style>
    * { box-sizing: border-box; } body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:#f5f7fb; color:#172033; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(100%,480px); text-align:center; background:#fff; border:1px solid #e6eaf0; border-radius:20px; padding:36px 28px; box-shadow:0 12px 40px rgba(23,32,51,.07); }
    .check { font-size:2.5rem; } h1 { margin:10px 0 8px; } p { color:#667085; line-height:1.5; }
    .team { margin:24px 0; padding:22px; border-radius:16px; background:#eef3ff; font-size:clamp(2rem,10vw,3rem); font-weight:800; color:#315efb; }
    a { color:#315efb; font-weight:700; text-decoration:none; }
  </style>
</head>
<body><main>
  <div class="check" aria-hidden="true">✓</div>
  <h1>You're checked in, {{ full_name }}!</h1>
  <p>Your Games Weekend team is:</p>
  <div class="team">{{ team }}</div>
  <p>A confirmation email has been sent to your email address.</p>
  <a href="{{ url_for('teams') }}">View live team counts</a>
</main></body>
</html>
