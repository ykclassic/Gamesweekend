<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="30">
  <title>Live Team Counts</title>
  <style>
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; padding:24px; background:#f5f7fb; color:#172033; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(100%,760px); margin:0 auto; } header { display:flex; justify-content:space-between; align-items:end; gap:16px; margin-bottom:24px; } h1 { margin:0; } .refresh { color:#667085; font-size:.9rem; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; } .card { background:#fff; border:1px solid #e6eaf0; border-radius:18px; padding:24px; box-shadow:0 8px 28px rgba(23,32,51,.05); } .name { color:#667085; font-weight:650; } .count { margin-top:8px; font-size:2.7rem; font-weight:800; }
    .total { margin-top:14px; background:#172033; color:#fff; } .total .name { color:#d5d9e2; } a { display:inline-block; margin-top:24px; color:#315efb; font-weight:700; text-decoration:none; }
    @media (max-width:520px) { body { padding:16px; } header { display:block; } .refresh { margin-top:6px; } .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body><main>
  <header><div><h1>Live Team Counts</h1><div class="refresh">Updates automatically every 30 seconds</div></div></header>
  <section class="grid" aria-label="Team membership counts">
    {% for team, count in teams.items() %}<article class="card"><div class="name">{{ team }}</div><div class="count">{{ count }}</div></article>{% endfor %}
    <article class="card total"><div class="name">Total Participants</div><div class="count">{{ total }}</div></article>
  </section>
  <a href="{{ url_for('index') }}">← Back to check-in</a>
</main></body>
</html>
